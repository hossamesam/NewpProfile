name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AE4753: ${{ secrets.AE4753 }}
          B2DC69: ${{ secrets.B2DC69 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AE4753', '')
          k2 = os.environ.get('B2DC69', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 3ba0c31a8ecb43c1d91b4f372ab0 -->', k1) if k1 else txt
          out = out.replace('<!-- 25a825fb6c1b33f7a3511343 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
